<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and Dependencies -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f8fafc;
    }

    .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse-slow {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .animate-fade-in {
      animation: fade-in 0.6s ease-out;
    }

    .animate-slide-up {
      animation: slide-up 0.4s ease-out;
    }

    .hover\:scale-102:hover {
      transform: scale(1.02);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Smooth transitions */
    * {
      transition-property: color, background-color, border-color, transform, opacity, box-shadow;
      transition-duration: 200ms;
      transition-timing-function: ease-out;
    }

    button, a, input {
      transition-duration: 150ms;
    }

    /* Focus styles */
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    /* Gradient mesh background effect */
    .gradient-mesh {
      background: 
        radial-gradient(at 20% 30%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 70%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(147, 197, 253, 0.05) 0px, transparent 50%);
    }

    /* Noise texture overlay for premium feel */
    .noise-overlay {
      position: relative;
    }

    .noise-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.015;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' /%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Breathing animation for recording indicator */
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.7;
      }
    }

    .animate-breathe {
      animation: breathe 2s ease-in-out infinite;
    }

    /* Loading dots animation */
    @keyframes bounce-delay {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-8px);
      }
    }

    .animate-bounce {
      animation: bounce-delay 1.4s infinite ease-in-out both;
    }

    /* Glass morphism effect */
    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Subtle shadow elevation */
    .shadow-elegant {
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.08), 0 2px 8px -1px rgba(0, 0, 0, 0.04);
    }

    .shadow-elegant-lg {
      box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.15), 0 8px 24px -4px rgba(0, 0, 0, 0.08);
    }

    /* Input focus glow */
    input:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Micro-interactions */
    button:active {
      transform: scale(0.98);
    }

    /* Responsive text sizing */
    @media (max-width: 640px) {
      .text-7xl {
        font-size: 3.5rem;
      }
      .text-8xl {
        font-size: 4rem;
      }
    }
  </style>
</head>

                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // Conversation Stage
      if (sessionStage === 'conversation') {
        return (
          <div className="h-screen bg-slate-50 flex flex-col">
            <header className="bg-white border-b border-slate-200 px-6 py-4 shadow-sm">
              <div className="max-w-4xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center shadow-lg">
                    <MessageCircle className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <div className="font-medium text-slate-900">REBT Session</div>
                    <div className="text-sm text-slate-500">Exploring your cognitive patterns</div>
                  </div>
                </div>
                
                <div className="flex gap-3">
                  {isAuthenticated && (
                    <div className="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-full">
                      <User className="w-4 h-4 text-slate-600" />
                      <span className="text-sm text-slate-600">{user?.name}</span>
                    </div>
                  )}
                  <button
                    onClick={completeSession}
                    className="px-6 py-2 text-slate-600 hover:text-slate-900 transition-colors font-medium"
                  >
                    End Session
                  </button>
                </div>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto px-6 py-8">
              <div className="max-w-4xl mx-auto space-y-6">
                {messages.map((message, index) => (
                  <div
                    key={index}
                    className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up`}
                  >
                    <div
                      className={`max-w-2xl px-6 py-4 rounded-3xl ${
                        message.role === 'user'
                          ? 'bg-slate-900 text-white shadow-elegant'
                          : 'bg-white border border-slate-200 text-slate-800 shadow-elegant'
                      }`}
                    >
                      <p className="text-base leading-relaxed whitespace-pre-wrap">{message.content}</p>
                    </div>
                  </div>
                ))}
                
                {isLoading && (
                  <div className="flex justify-start">
                    <div className="bg-white border border-slate-200 px-6 py-4 rounded-3xl shadow-elegant">
                      <div className="flex gap-2">
                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
                      </div>
                    </div>
                  </div>
                )}
                
                <div ref={messagesEndRef} />
              </div>
            </div>

            <div className="bg-white border-t border-slate-200 px-6 py-6 shadow-lg">
              <div className="max-w-4xl mx-auto">
                <div className="flex gap-3 items-end">
                  <button
                    onClick={toggleRecording}
                    className={`p-4 rounded-2xl transition-all shadow-elegant ${
                      isRecording
                        ? 'bg-red-500 text-white shadow-lg animate-breathe'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {isRecording ? <MicOff className="w-5 h-5" /> : <Mic className="w-5 h-5" />}
                  </button>

                  <div className="flex-1 relative">
                    <input
                      type="text"
                      value={inputMessage}
                      onChange={(e) => setInputMessage(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Share your thoughts..."
                      className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:border-blue-400 focus:bg-white transition-all text-slate-800"
                    />
                  </div>

                  <button
                    onClick={handleSendMessage}
                    disabled={!inputMessage.trim() || isLoading}
                    className="p-4 bg-slate-900 text-white rounded-2xl hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-elegant hover:shadow-elegant-lg"
                  >
                    <Send className="w-5 h-5" />
                  </button>
                </div>

                {isRecording && (
                  <div className="mt-3 flex items-center gap-2 text-sm text-red-600">
                    <div className="w-2 h-2 bg-red-500 rounded-full animate-pulse" />
                    <span>Recording... Speak now</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // Completion Stage
      if (sessionStage === 'complete') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-slate-100 flex items-center justify-center p-6">
            <div className="max-w-2xl w-full glass rounded-3xl p-12 shadow-2xl border border-slate-200 animate-fade-in">
              <div className="text-center space-y-6">
                <div className="w-16 h-16 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-elegant-lg">
                  <Check className="w-8 h-8 text-white" />
                </div>

                <h2 className="text-4xl font-serif text-slate-900 font-light">Session Complete</h2>
                
                <p className="text-lg text-slate-600 leading-relaxed">
                  You've completed your introductory REBT session. This brief exploration is just the beginning 
                  of understanding and transforming your cognitive patterns.
                </p>

                {detectedBeliefs.length > 0 && (
                  <div className="bg-blue-50 rounded-2xl p-6 text-left border border-blue-100">
                    <h3 className="font-medium text-slate-900 mb-3">Beliefs Explored Today:</h3>
                    <ul className="space-y-2">
                      {detectedBeliefs.map((belief, i) => (
                        <li key={i} className="text-slate-700 flex items-start gap-2">
                          <span className="text-blue-600 mt-1">•</span>
                          <span className="capitalize">{belief.replace(/_/g, ' ')}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                <div className="pt-6 space-y-4">
                  <button
                    onClick={bookSession}
                    className="w-full flex items-center justify-center gap-3 px-8 py-4 bg-slate-900 text-white rounded-2xl hover:bg-slate-800 transition-all shadow-elegant-lg hover:scale-102"
                  >
                    <Calendar className="w-5 h-5" />
                    <span className="text-lg font-medium">Continue with One-to-One Therapy</span>
                  </button>

                  {!isAuthenticated && (
                    <button
                      onClick={() => setShowAuthModal(true)}
                      className="w-full flex items-center justify-center gap-3 px-8 py-4 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl hover:border-slate-300 hover:bg-slate-50 transition-all shadow-elegant"
                    >
                      <LogIn className="w-5 h-5" />
                      <span className="font-medium">Save This Session</span>
                    </button>
                  )}

                  <button
                    onClick={() => window.location.reload()}
                    className="text-slate-600 hover:text-slate-900 transition-colors font-medium"
                  >
                    Return to Home
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return null;
    };

    // Initialize Lucide icons
    lucide.createIcons();

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TherapyPlatform />);
  </script>
</body>
</html>
